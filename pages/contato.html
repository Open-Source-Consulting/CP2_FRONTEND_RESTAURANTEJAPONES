<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura House - Contato</title>

    <link rel="stylesheet" href="../src/css/contato.css">
</head>
<body>

    <header>
        <div class="logo">Sakura House</div>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="portifolio.html">Portfólio</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="contato">
            <h1>Fale com o <span>Sakura House</span></h1>
            
            <p>Tem alguma dúvida, sugestão ou deseja fazer uma reserva? Envie sua mensagem!</p>

            <form id="formulario">

                <input type="text" id="nome" placeholder="Seu nome completo" required>

                <input type="email" id="email" placeholder="Seu melhor e-mail" required>

                <textarea id="mensagem" placeholder="Como podemos te ajudar hoje?" required></textarea>

                <button type="submit">Enviar Mensagem</button>

            </form>
        </section>

    </main>

    <footer>
        <p>Telefone: (11) 99999-9999</p>
        <p>Email: contato@sakurahouse.com</p>
        <p>Instagram: @sakurahouse</p>
        <p>© 2026 Sakura House</p>
    </footer>

    <script src="../src/js/script.js"></script>
</body>
</html>
